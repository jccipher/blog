name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_daytime:
        description: "I have fresh human approval for this one daytime deployment"
        type: boolean
        default: false
      approved_until:
        description: "One-run approval expires at this ISO timestamp (within two hours)"
        type: string
        default: ""
      approved_sha:
        description: "Exact reviewed full commit SHA for this one deployment"
        type: string
        default: ""

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.window.outputs.allowed }}
      start_deadline: ${{ steps.window.outputs.start_deadline }}
      deadline: ${{ steps.window.outputs.deadline }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate nightly window or one-run human approval
        id: window
        run: node .agents/skills/nightly-blog-pipeline/scripts/deployment_window.mjs

  build:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare available audio without blocking text
        run: node .agents/skills/nightly-blog-pipeline/scripts/deploy_audio.mjs
        env:
          BLOG_DEPLOYMENT_DEADLINE: ${{ needs.authorize.outputs.deadline }}

      - name: Build and validate site
        run: npm run check
        env:
          BLOG_AUDIO_MANIFEST: .ai-blog/deploy-audio.json

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site/blog
          retention-days: 1

  deploy:
    needs: [authorize, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check final deployment deadline
        run: |
          node -e "if(Date.now()>=Number(process.env.BLOG_DEPLOYMENT_START_DEADLINE))throw new Error('Deployment authorization expired');"
        env:
          BLOG_DEPLOYMENT_START_DEADLINE: ${{ needs.authorize.outputs.start_deadline }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
